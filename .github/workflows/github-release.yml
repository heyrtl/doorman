name: Sync GitHub packages and releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-release.yml
      - scripts/sync-github-release.mjs
  workflow_run:
    workflows: [Stage npm release]
    types: [completed]
  schedule:
    # npm approval happens outside GitHub; pick up approved versions hourly.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: github-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'heyrtl/doorman' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/
          scope: '@heyrtl'
          package-manager-cache: false
      - run: npm test
      - name: Mirror approved npm versions and create release pages
        run: node scripts/sync-github-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
