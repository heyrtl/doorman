name: Bug report
description: Report a problem with Doorman or one of its integrations.
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the Doorman version, Node.js version, framework, and host if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Share a minimal example or command. Remove credentials and private content.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: For HTTP issues, include the status and relevant headers for both requests.
    validations:
      required: true
